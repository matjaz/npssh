# Builds and publishes a release when a version tag is pushed:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The version comes from the tag (vX.Y.Z). Optional configuration
# (Settings › Secrets and variables › Actions):
#
#   HOMEBREW_TAP_TOKEN   fine-grained token with Contents: read and write on the
#                        tap repository. Without it the formula (npssh.rb) is
#                        only attached to the release, to be copied by hand.
#   vars.HOMEBREW_TAP    tap repository (default <owner>/homebrew-tap)

name: Release

on:
  push:
    tags: ["v*"]
  # Test run: builds and tests everything, uploads the tarball and formula as a
  # workflow artifact, but creates no release and does not touch the tap.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      TAG: ${{ github.ref_name }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
      HOMEBREW_TAP: ${{ vars.HOMEBREW_TAP || format('{0}/homebrew-tap', github.repository_owner) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Version from tag
        run: |
          if [[ "$DRY_RUN" == true ]]; then
            version="0.0.0-test.${GITHUB_SHA::7}"
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            version="${TAG#v}"
          else
            echo "::error::tag $TAG is not of the form vX.Y.Z"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Test
        run: |
          go vet ./...
          go test -race ./...

      - name: Build tarball and formula
        run: scripts/release.sh "$VERSION"

      - name: Check binary
        run: |
          dist/build/npssh version | grep -qx "npssh $VERSION"
          lipo dist/build/npssh -verify_arch arm64 x86_64
          codesign --verify dist/build/npssh

      - name: Upload test-run artifacts
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: npssh-${{ env.VERSION }}-test
          path: |
            dist/npssh-*.tar.gz
            dist/npssh.rb

      - name: Create GitHub release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/npssh-*.tar.gz dist/npssh.rb \
            --title "npssh $VERSION" \
            --notes "Install: \`brew install ${HOMEBREW_TAP%/homebrew-tap}/tap/npssh\` (macOS 11+, universal binary)." \
            --generate-notes

      - name: Update Homebrew tap
        if: env.DRY_RUN != 'true'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "$TAP_TOKEN" ]]; then
            echo "::warning::No HOMEBREW_TAP_TOKEN: copy npssh.rb from this release to $HOMEBREW_TAP Formula/npssh.rb by hand."
            exit 0
          fi
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${HOMEBREW_TAP}.git" "$RUNNER_TEMP/tap"
          mkdir -p "$RUNNER_TEMP/tap/Formula"
          cp dist/npssh.rb "$RUNNER_TEMP/tap/Formula/npssh.rb"
          cd "$RUNNER_TEMP/tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/npssh.rb
          if git diff --cached --quiet; then
            echo "Formula unchanged."
          else
            git commit -m "npssh $VERSION"
            git push
          fi
